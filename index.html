<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DIGITAL MONSTER v2</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app-shell">
    <div id="status-bar">
      <span class="badge">v2 / Dart bridge</span>
      <span id="dart-status">Loading Dart…</span>
    </div>

    <div id="main">
      <div id="jail">
        <div id="monitor">
          <canvas id="sample" width="200" height="200"></canvas>
        </div>
      </div>

      <div id="buttons">
        <button id="buttonA" type="button" aria-label="Action A"></button>
        <button id="buttonB" type="button" aria-label="Action B"></button>
        <button id="buttonC" type="button" aria-label="Action C"></button>
      </div>
    </div>

    <div id="dart-panel">
      <p>
        旧 JS の描画は維持しつつ、Dart から UI 状態を触れるようにした最初の一歩やで。
      </p>
      <div class="actions">
        <button id="dart-feed" class="secondary" type="button">Dartから Feed 表示</button>
        <button id="dart-toggle" class="secondary" type="button">Dart表示 ON/OFF</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script defer src="main.dart.js"></script>
</body>
</html>
